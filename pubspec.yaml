name: eastmarkhk_crm
description: EastmarkHK CRM — contacts, pipeline, tâches, dictée, modules (facturation, scanner, stock, leads, IA, sync)
publish_to: 'none'
version: 1.0.1+20

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8
  google_fonts: ^8.2.1
  http: ^1.2.2
  # Parseur HTML5 pur Dart (aucun code natif, donc aucun risque côté build
  # Xcode/Android) — utilisé pour interpréter le HTML collé tel quel dans
  # les notes riches (voir lib/core/utils/rich_notes.dart), y compris le
  # HTML complet généré ailleurs (commentaires, entités, styles en ligne,
  # thead/tbody/caption…), plutôt qu'un mini-analyseur maison à base de
  # RegExp trop fragile pour du HTML réel.
  html: ^0.15.4
  # Éditeur de notes riches — vrai éditeur WYSIWYG (Jodit, licence MIT)
  # embarqué dans une WebView (assets/jodit/, voir
  # lib/core/widgets/jodit_editor.dart), plutôt qu'une réimplémentation
  # façon Quill : Quill n'a aucun support de tableau éditable/
  # redimensionnable, Jodit si. Fourni en local — pas de CDN. TinyMCE avait
  # été essayé d'abord mais sa version auto-hébergée gratuite est en GPLv2+,
  # incompatible avec de futurs modules payants dans la même app.
  webview_flutter: ^4.13.1
  crypto: ^3.0.6
  path: ^1.9.1
  path_provider: ^2.1.5
  sqflite: ^2.4.2
  sqflite_common_ffi: ^2.3.5
  intl: ^0.20.2
  shared_preferences: ^2.3.3
  window_manager: ^0.5.2
  flutter_secure_storage: ^10.3.1
  country_picker: ^2.0.27
  country_flags: ^4.1.2
  url_launcher: ^6.3.1
  file_selector: ^1.1.0
  desktop_drop: ^0.7.1
  image_picker: ^1.2.3
  image: ^4.9.1
  share_plus: ^13.3.0
  fl_chart: ^1.2.0
  uuid: ^4.5.1
  speech_to_text: ^7.0.0
  dlibphonenumber: ^1.1.68
  local_auth: ^3.0.2
  permission_handler: ^13.0.0
  package_info_plus: ^10.2.1
  in_app_purchase: ^3.2.3
  flutter_svg: ^2.2.0
  # Génération du Privacy Report (tool/generate_privacy_pdf.dart) — même
  # dépendance que les autres apps EastmarkHK (e-Invoicing, Trading).
  pdf: ^3.13.0

# sqflite_common_ffi → sqlite3 : évite le téléchargement GitHub des .dylib/.dll
# (échecs réseau intermittents au build) et un binaire embarqué en plus.
# Utilise la lib système : libsqlite3 sur macOS/Linux, winsqlite3.dll sur
# Windows 10+ (même config que EastmarkHK e-Invoicing).
hooks:
  user_defines:
    sqlite3:
      source: system
      name: sqlite3
      name_windows: winsqlite3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  # Faux path_provider pour les tests DB (voir test/support/fake_path_provider.dart)
  # — sans ça, getApplicationSupportDirectory() plante hors app réelle.
  path_provider_platform_interface: ^2.1.2
  flutter_launcher_icons: ^0.14.4
  flutter_native_splash: ^2.4.4
  msix: ^3.18.0

flutter:
  uses-material-design: true
  # Génère AppLocalizations depuis lib/l10n/*.arb à chaque build (voir
  # l10n.yaml) — aucune commande manuelle à lancer, `flutter run`/`build`
  # s'en charge.
  generate: true
  assets:
    - assets/branding/
    # Logos messagerie (Simple Icons, CC0) — SVG locaux, pas de CDN.
    - assets/messaging/
    # Jodit auto-hébergé, licence MIT (voir lib/core/widgets/jodit_editor.dart)
    # — bundle unique (JS+CSS), pas de sous-dossiers à lister.
    - assets/jodit/

# Icône de l'app (Dock/launcher/App Store) — après modification de l'image,
# régénérer avec : dart run flutter_launcher_icons
flutter_launcher_icons:
  # app_icon_v3.png : version définitive fournie par l'utilisateur (déjà
  # recadrée sur le seul insigne EastmarkHK CRM, sans les décorations
  # latérales de app_icon.png d'origine).
  image_path: "assets/branding/app_icon_v3.png"
  macos:
    generate: true
  ios:
    generate: true
  android:
    generate: true
  windows:
    generate: true
    icon_size: 256

# Microsoft Store / sideload MSIX.
# Pour le Store : réserver le nom dans Partner Center, puis coller les 3
# valeurs de "Product management > Product identity" ci-dessous et passer
# store: true — ou garder store: false ici et utiliser
# tool\build_msix.ps1 -Store avec les paramètres/env vars.
# Sans ça, `dart run msix:create` produit un paquet sideload signé localement.
#
# NB : EastmarkHK CRM est gratuit. Le module e-Invoicing (payant sur
# iOS/macOS via App Store IAP) n'a pas encore d'équivalent Microsoft Store
# sur Windows — en attendant, l'activation web (code + e-mail) reste
# disponible depuis l'écran Modules, comme sur les autres plateformes non
# App Store.
msix_config:
  display_name: EastmarkHK CRM
  publisher_display_name: EastmarkHK
  identity_name: EastmarkHK.CRM
  # Partner Center > Product identity > Package/Properties/Publisher :
  # publisher: CN=XXXXXXXX-XXXX-XXXX-XXXX-XXXXXXXXXXXX
  msix_version: 1.0.1.20
  logo_path: assets/branding/app_icon_v3.png
  capabilities: internetClient, microphone
  languages: en-us, fr-fr, nl-nl, de-de, es-es, it-it, pt-pt, pt-br, ja-jp, ko-kr, zh-cn, th-th, vi-vn, tr-tr, pl-pl, ru-ru, ar-sa, id-id, sv-se, el-gr, da-dk, fi-fi, cs-cz, sk-sk, hu-hu, ro-ro, bg-bg, hr-hr, uk-ua
  output_name: EastmarkHK-CRM
  install_certificate: false
  store: false

# Écran de chargement (splash natif au démarrage) — régénérer avec :
# dart run flutter_native_splash:create
#
# Sur Android 12+, le système imposes TOUJOURS un splash natif (fond +
# icône centrée) AVANT toute UI Flutter. Nous le rendons invisible :
# fond = même blanc/gris que le haut du visuel marketing, icône
# transparente. Le vrai splash (splash_crm_mobile_hd.png) apparaît
# ensuite via windowBackground + l'écran Flutter SplashScreen — sans
# le flash teal+icône (app_icon_v3) qu'on voyait avant.
flutter_native_splash:
  color: "#F8F8FA"
  # Visuel portrait CRM (iPhone / Android). Contenu = plein écran.
  image: assets/branding/splash_crm_mobile_hd.png
  fullscreen: true
  android: true
  ios: true
  web: false
  android_gravity: fill
  ios_content_mode: scaleAspectFill
  android_12:
    # Même teinte que le haut du splash marketing (pas #024C4F).
    color: "#F8F8FA"
    color_dark: "#F8F8FA"
    # Icône transparente → on ne voit plus l'icône CRM sur fond teal.
    image: assets/branding/transparent_android12_icon.png
    image_dark: assets/branding/transparent_android12_icon.png
    icon_background_color: "#F8F8FA"
    icon_background_color_dark: "#F8F8FA"
